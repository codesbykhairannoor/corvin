[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ravens-ai"
version = "0.7.0"
description = "A Cognitive Boundary & Grudge-Memory Engine for Sovereign AI Agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Khairan Noor" }
]
keywords = [
    "ai",
    "agents",
    "guardrails",
    "affective-computing",
    "game-theory",
    "safety",
    "boundary-defense",
    "sovereign-ai"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/codesbykhairannoor/ravens"
Documentation = "https://github.com/codesbykhairannoor/ravens#readme"
Repository = "https://github.com/codesbykhairannoor/ravens.git"
Issues = "https://github.com/codesbykhairannoor/ravens/issues"
Funding = "https://tako.id/c/codesbykhai"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ravens"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

