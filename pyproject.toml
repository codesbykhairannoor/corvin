[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corvin"
version = "0.7.2"
description = "CORVIN: Cognitive Operational Resilience, Vigilance & Immunity Nexus for Sovereign AI Agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Khairan Noor" }
]
keywords = [
    "ai",
    "agents",
    "guardrails",
    "affective-computing",
    "game-theory",
    "safety",
    "boundary-defense",
    "sovereign-ai",
    "corvin",
    "ravens",
    "fastapi",
    "middleware"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
corvin = "corvin.cli:main"
ravens = "corvin.cli:main"

[project.urls]
Homepage = "https://github.com/codesbykhairannoor/corvin"
Documentation = "https://github.com/codesbykhairannoor/corvin#readme"
Repository = "https://github.com/codesbykhairannoor/corvin.git"
Issues = "https://github.com/codesbykhairannoor/corvin/issues"
Funding = "https://tako.id/c/codesbykhai"

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
]
dev = [
    "pytest>=8.0.0",
    "fastapi>=0.100.0",
    "starlette>=0.27.0",
    "httpx>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/corvin", "src/ravens"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
