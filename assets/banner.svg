<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%" fill="none">
  <!-- Subtle gradient background -->
  <rect width="800" height="220" rx="16" fill="#090d16"/>
  <rect width="798" height="218" x="1" y="1" rx="15" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle glow behind raven -->
  <circle cx="120" cy="110" r="75" fill="#38bdf8" opacity="0.04" filter="blur(20px)"/>

  <!-- Raven Icon Section (Scaled and translated) -->
  <g transform="translate(45, 30) scale(1.15)">
    <!-- Subtle circular halo -->
    <circle cx="70" cy="70" r="62" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.25"/>

    <!-- Perch Branch / Sovereign Horizon -->
    <path d="M 28 106 L 112 106" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round"/>

    <!-- Raven Feet / Talons -->
    <path d="M 64 96 L 64 106 M 60 106 L 68 106" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 78 98 L 78 106 M 74 106 L 82 106" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Raven Tail Feathers -->
    <path d="M 44 94 L 32 114 L 40 114 L 52 98" stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Main Body Silhouette -->
    <path d="
      M 42 78
      C 40 60, 42 42, 50 32
      C 54 26, 62 24, 70 25
      C 76 26, 80 29, 84 34
      L 106 42
      C 107 43, 105 45, 100 47
      L 85 49
      C 84 58, 86 70, 84 82
      C 82 92, 74 98, 64 98
      C 54 98, 46 90, 42 78 Z
    " stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Beak Mouth Line -->
    <path d="M 85 43 L 104 43" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Folded Sovereign Wing -->
    <path d="
      M 55 48
      C 50 56, 46 68, 48 80
      C 49 87, 54 94, 60 98
      C 56 88, 58 74, 66 62
      C 72 53, 76 48, 76 48
      C 70 46, 62 46, 55 48 Z
    " stroke="#f8fafc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Wing Feather Accents -->
    <path d="M 54 62 C 52 70, 54 78, 58 84" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M 62 66 C 60 74, 62 82, 66 88" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>

    <!-- Sovereign Eye -->
    <circle cx="76" cy="34" r="2.8" fill="#38bdf8"/>
    <circle cx="77" cy="33.2" r="0.9" fill="#ffffff"/>

    <!-- Crown Crest -->
    <path d="M 60 25 C 64 21, 72 21, 76 25" stroke="#94a3b8" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <!-- Typography Section -->
  <text x="240" y="88" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5">ravens</text>
  
  <text x="430" y="88" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="1">v0.7.0</text>

  <text x="242" y="125" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">
    A Cognitive Boundary &amp; Grudge-Memory Engine for Sovereign AI Agents
  </text>

  <text x="242" y="156" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="400">
    Affective Dynamics (EMA) • Game Theory CTFT • Zero-Profanity Semantic Shield • Streaming Armor
  </text>
</svg>
