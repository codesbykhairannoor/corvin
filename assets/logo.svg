<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 140" width="100%" height="100%" fill="none">
  <!-- Subtle circular halo -->
  <circle cx="70" cy="70" r="62" fill="none" stroke="#0f172a" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.12"/>

  <!-- Perch Branch / Sovereign Horizon -->
  <path d="M 28 106 L 112 106" stroke="#0f172a" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Raven Feet / Talons -->
  <path d="M 64 96 L 64 106 M 60 106 L 68 106" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 78 98 L 78 106 M 74 106 L 82 106" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Raven Tail Feathers (wedge pointing down-left) -->
  <path d="M 44 94 L 32 114 L 40 114 L 52 98" stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Body Silhouette: Nape, Crown, Beak, Breast, Belly -->
  <path d="
    M 42 78
    C 40 60, 42 42, 50 32
    C 54 26, 62 24, 70 25
    C 76 26, 80 29, 84 34
    L 106 42
    C 107 43, 105 45, 100 47
    L 85 49
    C 84 58, 86 70, 84 82
    C 82 92, 74 98, 64 98
    C 54 98, 46 90, 42 78 Z
  " stroke="#0f172a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Beak Mouth Line (Subtle separation) -->
  <path d="M 85 43 L 104 43" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Folded Sovereign Wing -->
  <path d="
    M 55 48
    C 50 56, 46 68, 48 80
    C 49 87, 54 94, 60 98
    C 56 88, 58 74, 66 62
    C 72 53, 76 48, 76 48
    C 70 46, 62 46, 55 48 Z
  " stroke="#0f172a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wing Feather Quill Accents (Ollama Minimalist Lines) -->
  <path d="M 54 62 C 52 70, 54 78, 58 84" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M 62 66 C 60 74, 62 82, 66 88" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Sovereign Eye (Alert, dignified) -->
  <circle cx="76" cy="34" r="2.8" fill="#0f172a"/>
  <!-- Catchlight in eye -->
  <circle cx="77" cy="33.2" r="0.9" fill="#ffffff"/>

  <!-- Subtle Crown / Crest Quill Line -->
  <path d="M 60 25 C 64 21, 72 21, 76 25" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
